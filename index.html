<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Consórcio - Lei 11.795/2008</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Dados baseados nas médias de mercado divulgadas historicamente
        // Separados por segmento, pois as taxas variam dependendo do bem e prazo.
        // Adicionadas métricas de saúde do grupo (Contemplação e Inadimplência)
        const INSTITUTIONS = [
            { id: 1, name: "Caixa Consórcios", regions: ['all'], isReliable: true, contemplationRate: 2.5, defaultRate: 3.2, rates: { veiculos: { admin: 12.0, reserve: 1.0 }, imoveis: { admin: 18.0, reserve: 1.0 }, servicos: { admin: 15.0, reserve: 2.0 }, eletro: { admin: 16.0, reserve: 2.0 } }, color: "bg-blue-600", logo: "🏛️" },
            { id: 2, name: "BB Consórcios", regions: ['all'], isReliable: true, contemplationRate: 2.4, defaultRate: 3.5, rates: { veiculos: { admin: 12.5, reserve: 1.5 }, imoveis: { admin: 19.0, reserve: 1.0 }, servicos: { admin: 15.5, reserve: 1.5 }, eletro: { admin: 16.5, reserve: 2.5 } }, color: "bg-yellow-500", logo: "🏦" },
            { id: 3, name: "Bradesco Consórcios", regions: ['all'], isReliable: true, contemplationRate: 2.8, defaultRate: 4.1, rates: { veiculos: { admin: 14.0, reserve: 1.5 }, imoveis: { admin: 20.0, reserve: 1.5 }, servicos: { admin: 16.0, reserve: 1.0 }, eletro: { admin: 17.0, reserve: 1.0 } }, color: "bg-red-600", logo: "🔴" },
            { id: 4, name: "Itaú Consórcios", regions: ['all'], isReliable: true, contemplationRate: 2.9, defaultRate: 3.8, rates: { veiculos: { admin: 14.5, reserve: 1.0 }, imoveis: { admin: 20.5, reserve: 1.0 }, servicos: { admin: 16.5, reserve: 1.5 }, eletro: { admin: 17.5, reserve: 1.5 } }, color: "bg-orange-500", logo: "🟠" },
            { id: 5, name: "Porto Seguro", regions: ['all'], isReliable: true, contemplationRate: 3.5, defaultRate: 2.1, rates: { veiculos: { admin: 15.0, reserve: 0.5 }, imoveis: { admin: 21.0, reserve: 0.5 }, servicos: { admin: 17.0, reserve: 1.0 }, eletro: { admin: 18.0, reserve: 1.0 } }, color: "bg-blue-800", logo: "🛡️" },
            { id: 6, name: "Banrisul (Exemplo Regional)", regions: ['Sul'], isReliable: true, contemplationRate: 2.2, defaultRate: 3.9, rates: { veiculos: { admin: 11.5, reserve: 1.0 }, imoveis: { admin: 17.5, reserve: 1.0 }, servicos: { admin: 14.5, reserve: 1.5 }, eletro: { admin: 15.5, reserve: 1.5 } }, color: "bg-blue-400", logo: "💧" },
            { id: 7, name: "BRB Consórcios", regions: ['Centro-Oeste'], isReliable: false, contemplationRate: 1.8, defaultRate: 6.5, rates: { veiculos: { admin: 11.8, reserve: 1.0 }, imoveis: { admin: 18.5, reserve: 1.0 }, servicos: { admin: 14.8, reserve: 2.0 }, eletro: { admin: 15.8, reserve: 2.0 } }, color: "bg-cyan-600", logo: "🏢" },
            { id: 8, name: "Consórcio Nordeste", regions: ['Nordeste'], isReliable: false, contemplationRate: 1.9, defaultRate: 7.0, rates: { veiculos: { admin: 11.0, reserve: 1.0 }, imoveis: { admin: 17.0, reserve: 1.0 }, servicos: { admin: 14.0, reserve: 1.0 }, eletro: { admin: 15.0, reserve: 1.0 } }, color: "bg-green-600", logo: "🌵" },
            { id: 9, name: "Banpará Consórcios", regions: ['Norte'], isReliable: false, contemplationRate: 1.7, defaultRate: 6.8, rates: { veiculos: { admin: 12.2, reserve: 1.0 }, imoveis: { admin: 18.2, reserve: 1.0 }, servicos: { admin: 15.2, reserve: 1.5 }, eletro: { admin: 16.2, reserve: 1.5 } }, color: "bg-red-500", logo: "🌳" },
            { id: 10, name: "Sicoob SP/MG", regions: ['Sudeste'], isReliable: true, contemplationRate: 3.1, defaultRate: 2.5, rates: { veiculos: { admin: 11.9, reserve: 0.5 }, imoveis: { admin: 17.9, reserve: 0.5 }, servicos: { admin: 14.9, reserve: 1.0 }, eletro: { admin: 15.9, reserve: 1.0 } }, color: "bg-teal-600", logo: "🤝" },
        ];

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        };

        const InfoTooltip = ({ text }) => (
            <div className="group relative inline-block ml-1 cursor-help">
                <i data-lucide="info" className="w-4 h-4 text-slate-400 hover:text-blue-500 inline"></i>
                <div className="opacity-0 w-64 bg-slate-800 text-white text-xs rounded py-2 px-3 absolute z-10 group-hover:opacity-100 bottom-full left-1/2 transform -translate-x-1/2 -translate-y-2 pointer-events-none transition-opacity duration-200">
                    {text}
                    <div className="absolute top-full left-1/2 transform -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-800"></div>
                </div>
            </div>
        );

        const ConsorcioSimulator = () => {
            // State
            const [institutionsData, setInstitutionsData] = useState(INSTITUTIONS);
            const [segment, setSegment] = useState('veiculos');
            const [selectedRegion, setSelectedRegion] = useState('all');
            const [onlyReliable, setOnlyReliable] = useState(false);
            const [sortBy, setSortBy] = useState('cost'); // 'cost', 'contemplation', 'default'
            const [credit, setCredit] = useState(80000);
            const [months, setMonths] = useState(60);
            const [uploadError, setUploadError] = useState('');
            const [uploadSuccess, setUploadSuccess] = useState(false);
            const [baseDate, setBaseDate] = useState(null);

            const handleFileUpload = (event) => {
                setUploadError('');
                setUploadSuccess(false);
                setBaseDate(null);
                const file = event.target.files[0];
                if (!file) return;

                // Extrai o ano e mês do nome do arquivo padrão BACEN (ex: 202603Bens_Moveis_Grupos.csv)
                const dateMatch = file.name.match(/^(\d{4})(\d{2})/);
                if (dateMatch) {
                    const year = dateMatch[1];
                    const monthIdx = parseInt(dateMatch[2], 10) - 1;
                    const monthsNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                    if (monthIdx >= 0 && monthIdx < 12) {
                        setBaseDate(`${monthsNames[monthIdx]}/${year}`);
                    }
                }

                // Aceita qualquer arquivo .csv em vez de travar em um mês específico
                if (!file.name.toLowerCase().endsWith('.csv')) {
                    setUploadError('Por favor, envie um arquivo com extensão .csv baixado do Banco Central.');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
                        if (lines.length < 2) throw new Error("Arquivo vazio ou formato inválido.");
                        
                        // O Banco Central normalmente utiliza ';' como separador de colunas
                        const headers = lines[0].split(';').map(h => h.toLowerCase().replace(/["']/g, ''));
                        
                        // Busca colunas chaves do BACEN independente de pequenas variações de nome
                        const nomeIdx = headers.findIndex(h => h.includes('administradora') || h.includes('empresa'));
                        const taxaIdx = headers.findIndex(h => h.includes('taxa') && h.includes('administra'));
                        const fundoIdx = headers.findIndex(h => h.includes('fundo') && h.includes('reserva'));

                        if (nomeIdx === -1 || taxaIdx === -1) {
                            throw new Error("Colunas 'Administradora' ou 'Taxa de Administração' não encontradas na planilha.");
                        }

                        const mapData = new Map();

                        // Processa as linhas pulando o cabeçalho
                        for (let i = 1; i < lines.length; i++) {
                            const cols = lines[i].split(';').map(c => c.replace(/["']/g, ''));
                            if (cols.length > taxaIdx) {
                                const nome = cols[nomeIdx];
                                const taxaStr = cols[taxaIdx].replace(',', '.').replace('%', ''); // Trata os decimais (BR)
                                const taxa = parseFloat(taxaStr);
                                
                                let fundo = 0;
                                if (fundoIdx !== -1 && cols[fundoIdx]) {
                                    fundo = parseFloat(cols[fundoIdx].replace(',', '.').replace('%', '')) || 0;
                                }

                                // Agrupa e soma as taxas se a mesma empresa tiver vários grupos na planilha
                                if (!isNaN(taxa) && nome) {
                                    if (!mapData.has(nome)) {
                                        mapData.set(nome, { sumTaxa: 0, sumFundo: 0, count: 0 });
                                    }
                                    const data = mapData.get(nome);
                                    data.sumTaxa += taxa;
                                    data.sumFundo += fundo;
                                    data.count += 1;
                                }
                            }
                        }

                        // Converte o Map de volta para um Array amigável à nossa UI calculando as médias
                        const parsedResults = Array.from(mapData.entries()).map(([nome, data], index) => {
                            const avgTaxa = data.sumTaxa / data.count;
                            const avgFundo = data.sumFundo / data.count;
                            
                            // Tentativa simples de inferir a região pelo nome (já que o BACEN foca no CNPJ)
                            let regions = ['all'];
                            const upperNome = nome.toUpperCase();
                            if (upperNome.includes('SUL')) regions = ['Sul'];
                            else if (upperNome.includes('NORDESTE')) regions = ['Nordeste'];
                            else if (upperNome.includes('BRB') || upperNome.includes('GOIAS')) regions = ['Centro-Oeste'];
                            else if (upperNome.includes('NORTE') || upperNome.includes('AMAZONAS') || upperNome.includes('PARA')) regions = ['Norte'];
                            else if (upperNome.includes('SP') || upperNome.includes('PAULISTA') || upperNome.includes('MINAS')) regions = ['Sudeste'];

                            // Identificação de solidez/confiança baseada no histórico do mercado
                            const reliableKeywords = ['CAIXA', 'BB', 'BRASIL', 'BRADESCO', 'ITAU', 'ITAÚ', 'PORTO SEGURO', 'SICREDI', 'SICOOB', 'YAMAHA', 'HONDA', 'SANTANDER', 'BANRISUL', 'RODOBENS'];
                            const isInstReliable = reliableKeywords.some(kw => upperNome.includes(kw));

                            // Simulação de dados de saúde do grupo baseada em confiabilidade para os dados importados do CSV
                            const baseContemplation = isInstReliable ? (2.0 + Math.random() * 1.5) : (1.0 + Math.random() * 1.0);
                            const baseDefault = isInstReliable ? (2.0 + Math.random() * 3.0) : (6.0 + Math.random() * 4.0);

                            return {
                                id: 100 + index,
                                name: nome.length > 25 ? nome.substring(0, 22) + '...' : nome,
                                regions: regions,
                                isReliable: isInstReliable,
                                contemplationRate: baseContemplation,
                                defaultRate: baseDefault,
                                rates: {
                                    veiculos: { admin: avgTaxa, reserve: avgFundo },
                                    imoveis: { admin: avgTaxa * 1.4, reserve: avgFundo }, // Projeção temporária, pois a base é de veículos
                                    servicos: { admin: avgTaxa * 1.2, reserve: avgFundo + 1.0 },
                                    eletro: { admin: avgTaxa * 1.3, reserve: avgFundo + 1.0 }
                                },
                                color: "bg-emerald-600", // Cor verde oficial do BD para as importações reais
                                logo: "📊"
                            };
                        });

                        // Carrega todas as opções válidas. O filtro Top 5 agora é dinâmico por região.
                        const validResults = parsedResults.filter(a => !isNaN(a.rates.veiculos.admin));

                        if (validResults.length === 0) throw new Error("Nenhum dado válido de taxa encontrado na planilha.");

                        setInstitutionsData(validResults);
                        setSegment('veiculos'); // Garante que estaremos vendo a aba que faz sentido pro arquivo "Bens Moveis"
                        setSelectedRegion('all'); // Reseta a região para mostrar os resultados nacionais
                        setUploadSuccess(true);
                    } catch (error) {
                        setUploadError(error.message || "Erro ao tentar ler a estrutura da planilha.");
                    }
                };
                
                // Arquivos .csv do Governo Federal normalmente estão em ISO-8859-1 e não UTF-8
                reader.readAsText(file, 'ISO-8859-1'); 
            };

            // Re-render lucide icons when component updates
            useEffect(() => {
                lucide.createIcons();
            });

            // Custo Total = Crédito + (Crédito * (Taxa Admin + Fundo Reserva) / 100)
            const results = useMemo(() => {
                // 1. Filtra as instituições pela região e confiabilidade selecionadas
                const filtered = institutionsData.filter(inst => {
                    // Filtro de região
                    let regionMatch = true;
                    if (selectedRegion !== 'all') {
                        const instRegions = inst.regions || ['all'];
                        regionMatch = instRegions.includes('all') || instRegions.includes(selectedRegion);
                    }
                    
                    // Filtro de confiabilidade
                    let reliabilityMatch = true;
                    if (onlyReliable) {
                        reliabilityMatch = inst.isReliable;
                    }

                    return regionMatch && reliabilityMatch;
                });

                // 2. Calcula os custos baseados no prazo e valor
                return filtered.map(inst => {
                    const currentRates = inst.rates[segment] || inst.rates['veiculos']; // Fallback de segurança
                    const totalFeePercentage = currentRates.admin + currentRates.reserve;
                    // O valor da taxa é cobrado sobre o valor do crédito
                    const totalCost = credit + (credit * (totalFeePercentage / 100));
                    const monthlyInstallment = totalCost / months;
                    
                    return {
                        ...inst,
                        adminFee: currentRates.admin,
                        reserveFund: currentRates.reserve,
                        totalCost,
                        monthlyInstallment,
                        totalFeePercentage
                    };
                })
                .sort((a, b) => {
                    // Novo sistema de ordenação baseado na escolha do usuário
                    if (sortBy === 'cost') return a.totalCost - b.totalCost; // Menor custo primeiro
                    if (sortBy === 'contemplation') return b.contemplationRate - a.contemplationRate; // Maior índice de sorteio primeiro
                    if (sortBy === 'default') return a.defaultRate - b.defaultRate; // Menor inadimplência primeiro
                    return 0;
                }) 
                .slice(0, 5); // Pega apenas o Top 5
            }, [institutionsData, credit, months, segment, selectedRegion, onlyReliable, sortBy]);

            const getLimits = () => {
                if(segment === 'imoveis') return { cMin: 50000, cMax: 1000000, cStep: 10000, mMin: 60, mMax: 240, mStep: 12, cLabel: 'R$ 1M', mLabel: '240x' };
                if(segment === 'servicos') return { cMin: 5000, cMax: 50000, cStep: 1000, mMin: 12, mMax: 48, mStep: 6, cLabel: 'R$ 50k', mLabel: '48x' };
                if(segment === 'eletro') return { cMin: 2000, cMax: 30000, cStep: 1000, mMin: 12, mMax: 48, mStep: 6, cLabel: 'R$ 30k', mLabel: '48x' };
                return { cMin: 10000, cMax: 300000, cStep: 5000, mMin: 12, mMax: 120, mStep: 12, cLabel: 'R$ 300k', mLabel: '120x' };
            };
            const limits = getLimits();

            return (
                <div className="min-h-screen p-4 md:p-8 flex justify-center">
                    <div className="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        {/* Left Column: Controls & Info */}
                        <div className="col-span-1 space-y-6">
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                <h1 className="text-2xl font-bold text-slate-800 mb-2 flex items-center gap-2">
                                    <i data-lucide="calculator" className="text-blue-600"></i>
                                    Simulador
                                </h1>
                                <p className="text-sm text-slate-500 mb-6">
                                    Compare custos baseados na Lei de Consórcios (Lei nº 11.795/08).
                                </p>

                                {/* Input: Segmento */}
                                <div className="mb-6">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2">
                                        Tipo de Bem / Serviço
                                    </label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button 
                                            onClick={() => { setSegment('veiculos'); setCredit(80000); setMonths(60); }}
                                            className={`py-2 px-2 rounded-lg font-medium text-xs md:text-sm flex items-center justify-center gap-2 transition-colors ${segment === 'veiculos' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                        >
                                            <i data-lucide="car" className="w-4 h-4"></i> Veículos
                                        </button>
                                        <button 
                                            onClick={() => { setSegment('imoveis'); setCredit(300000); setMonths(180); }}
                                            className={`py-2 px-2 rounded-lg font-medium text-xs md:text-sm flex items-center justify-center gap-2 transition-colors ${segment === 'imoveis' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                        >
                                            <i data-lucide="home" className="w-4 h-4"></i> Imóveis
                                        </button>
                                        <button 
                                            onClick={() => { setSegment('servicos'); setCredit(15000); setMonths(36); }}
                                            className={`py-2 px-2 rounded-lg font-medium text-xs md:text-sm flex items-center justify-center gap-2 transition-colors ${segment === 'servicos' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                        >
                                            <i data-lucide="briefcase" className="w-4 h-4"></i> Serviços
                                        </button>
                                        <button 
                                            onClick={() => { setSegment('eletro'); setCredit(8000); setMonths(24); }}
                                            className={`py-2 px-2 rounded-lg font-medium text-xs md:text-sm flex items-center justify-center gap-2 transition-colors ${segment === 'eletro' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                        >
                                            <i data-lucide="tv" className="w-4 h-4"></i> Eletro
                                        </button>
                                    </div>
                                </div>

                                {/* Input: Região */}
                                <div className="mb-6">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-1">
                                        <i data-lucide="map-pin" className="w-4 h-4"></i> Região de Atendimento
                                    </label>
                                    <select 
                                        value={selectedRegion}
                                        onChange={(e) => setSelectedRegion(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 font-medium transition-colors mb-3"
                                    >
                                        <option value="all">Nacional (Todas as Regiões)</option>
                                        <option value="Norte">Norte</option>
                                        <option value="Nordeste">Nordeste</option>
                                        <option value="Centro-Oeste">Centro-Oeste</option>
                                        <option value="Sudeste">Sudeste</option>
                                        <option value="Sul">Sul</option>
                                    </select>
                                    
                                    {/* Toggle: Apenas Confiáveis */}
                                    <button
                                        onClick={() => setOnlyReliable(!onlyReliable)}
                                        className={`w-full py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-colors border shadow-sm ${
                                            onlyReliable 
                                            ? 'bg-emerald-50 border-emerald-500 text-emerald-800 hover:bg-emerald-100' 
                                            : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'
                                        }`}
                                    >
                                        <i data-lucide={onlyReliable ? "shield-check" : "shield"} className={`w-4 h-4 ${onlyReliable ? 'text-emerald-600' : 'text-slate-400'}`}></i>
                                        {onlyReliable ? 'Mostrando as mais confiáveis (Top BCB)' : 'Filtrar instituições mais seguras'}
                                    </button>
                                </div>

                                {/* Input: Critério de Ranking */}
                                <div className="mb-6">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-1">
                                        <i data-lucide="bar-chart-2" className="w-4 h-4"></i> Prioridade do Ranking
                                    </label>
                                    <div className="flex flex-col gap-2">
                                        <button 
                                            onClick={() => setSortBy('cost')}
                                            className={`py-2 px-3 rounded-lg font-medium text-xs md:text-sm flex items-center gap-2 transition-colors border text-left ${sortBy === 'cost' ? 'bg-blue-50 border-blue-500 text-blue-800' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                        >
                                            <i data-lucide="coins" className={`w-4 h-4 shrink-0 ${sortBy === 'cost' ? 'text-blue-600' : 'text-slate-400'}`}></i>
                                            Menor Custo Efetivo
                                        </button>
                                        <button 
                                            onClick={() => setSortBy('contemplation')}
                                            className={`py-2 px-3 rounded-lg font-medium text-xs md:text-sm flex items-center gap-2 transition-colors border text-left ${sortBy === 'contemplation' ? 'bg-amber-50 border-amber-500 text-amber-800' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                        >
                                            <i data-lucide="zap" className={`w-4 h-4 shrink-0 ${sortBy === 'contemplation' ? 'text-amber-600' : 'text-slate-400'}`}></i>
                                            Maior Índice de Sorteios/Lances
                                        </button>
                                        <button 
                                            onClick={() => setSortBy('default')}
                                            className={`py-2 px-3 rounded-lg font-medium text-xs md:text-sm flex items-center gap-2 transition-colors border text-left ${sortBy === 'default' ? 'bg-purple-50 border-purple-500 text-purple-800' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                        >
                                            <i data-lucide="heart-handshake" className={`w-4 h-4 shrink-0 ${sortBy === 'default' ? 'text-purple-600' : 'text-slate-400'}`}></i>
                                            Menor Inadimplência (Saúde do Grupo)
                                        </button>
                                    </div>
                                </div>

                                {/* Input: Valor do Crédito */}
                                <div className="mb-6">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2">
                                        Valor do Crédito (R$)
                                    </label>
                                    <input 
                                        type="number" 
                                        min={limits.cMin}
                                        max={limits.cMax}
                                        step={limits.cStep}
                                        value={credit}
                                        onChange={(e) => setCredit(Number(e.target.value))}
                                        className="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 font-medium transition-colors"
                                    />
                                    <input 
                                        type="range" 
                                        min={limits.cMin} 
                                        max={limits.cMax}
                                        step={limits.cStep}
                                        value={credit}
                                        onChange={(e) => setCredit(Number(e.target.value))}
                                        className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer mt-4 accent-blue-600"
                                    />
                                    <div className="flex justify-between text-xs text-slate-400 mt-1">
                                        <span>R$ {limits.cMin / 1000}k</span>
                                        <span>{limits.cLabel}</span>
                                    </div>
                                </div>

                                {/* Input: Prazo */}
                                <div className="mb-6">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2">
                                        Prazo (Meses)
                                    </label>
                                    <input 
                                        type="number" 
                                        min={limits.mMin}
                                        max={limits.mMax}
                                        step={limits.mStep}
                                        value={months}
                                        onChange={(e) => setMonths(Number(e.target.value))}
                                        className="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 font-medium transition-colors"
                                    />
                                    <input 
                                        type="range" 
                                        min={limits.mMin} 
                                        max={limits.mMax}
                                        step={limits.mStep}
                                        value={months}
                                        onChange={(e) => setMonths(Number(e.target.value))}
                                        className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer mt-4 accent-blue-600"
                                    />
                                    <div className="flex justify-between text-xs text-slate-400 mt-1">
                                        <span>{limits.mMin}x</span>
                                        <span>{limits.mLabel}</span>
                                    </div>
                                </div>
                                
                                <div className="bg-blue-50 rounded-lg p-4 mt-6 border border-blue-100">
                                    <h4 className="text-sm font-semibold text-blue-800 mb-1 flex items-center gap-1">
                                        <i data-lucide="info" className="w-4 h-4"></i>
                                        Como funciona a Lei?
                                    </h4>
                                    <p className="text-xs text-blue-900 leading-relaxed">
                                        Pela <b>Lei 11.795/2008</b>, consórcios <b>não cobram juros</b>. O custo é formado por:
                                        <br/><br/>
                                        • <b>Taxa de Administração:</b> Remunera a empresa. <br/>
                                        • <b>Fundo de Reserva:</b> Fundo de proteção do grupo para cobrir inadimplências. Devolvido no fim do grupo caso não seja utilizado.
                                    </p>
                                </div>

                                {/* Componente de Upload do CSV */}
                                <div className="bg-white rounded-xl shadow-sm border border-emerald-200 p-5 mt-6 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                                    <h4 className="text-sm font-bold text-slate-800 mb-1 flex items-center gap-2">
                                        <i data-lucide="upload-cloud" className="text-emerald-600"></i>
                                        Planilha Oficial BACEN
                                    </h4>
                                    <p className="text-xs text-slate-500 mb-3">
                                        Carregue a planilha para atualizar o ranking com as taxas oficiais de mercado.
                                    </p>
                                    
                                    <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4">
                                        <p className="text-[11px] text-amber-800 leading-relaxed">
                                            <b>⚠️ IMPORTANTE:</b> Acesse o <a href="https://www.bcb.gov.br/estabilidadefinanceira/consorciobd" target="_blank" rel="noreferrer" className="text-amber-600 underline font-bold hover:text-amber-700">Portal de Dados do BCB</a> e baixe o relatório mensal de <b>Dados Consolidados</b> (ex: <i>Bens Móveis - Grupos.csv</i>). <br/>O sistema <b>não</b> funcionará com relatórios de reclamações ou dados de cotas individuais.
                                        </p>
                                    </div>

                                    <input 
                                        type="file" 
                                        accept=".csv"
                                        onChange={handleFileUpload}
                                        className="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer transition-colors"
                                    />
                                    {uploadError && (
                                        <div className="mt-3 text-xs text-red-600 bg-red-50 p-2 rounded border border-red-100 flex items-start gap-1">
                                            <i data-lucide="alert-circle" className="w-3 h-3 mt-0.5 shrink-0"></i>
                                            {uploadError}
                                        </div>
                                    )}
                                    {uploadSuccess && (
                                        <div className="mt-3 text-xs text-emerald-700 bg-emerald-50 p-2 rounded border border-emerald-100 flex items-start gap-1">
                                            <i data-lucide="check-circle" className="w-3 h-3 mt-0.5 shrink-0"></i>
                                            Ranking atualizado com sucesso usando os dados oficiais! {baseDate && <b>(Ref: {baseDate})</b>}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Right Column */}
                        <div className="col-span-1 lg:col-span-2 space-y-4">
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2 mb-2">
                                <i data-lucide="award" className="text-amber-500"></i>
                                Ranking das Melhores Opções
                            </h2>
                            <p className="text-sm text-slate-500 mb-4">
                                Simulação baseada nas taxas médias praticadas pelo mercado para o crédito de {formatCurrency(credit)} em {months} meses.
                                {baseDate && (
                                    <span className="inline-flex items-center gap-1 mt-2 bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-md text-xs font-semibold border border-emerald-200 block md:inline-flex md:ml-2">
                                        <i data-lucide="calendar" className="w-3.5 h-3.5"></i> Base de Dados BACEN: {baseDate}
                                    </span>
                                )}
                            </p>

                            <div className="space-y-4">
                                {results.map((inst, index) => (
                                    <div 
                                        key={inst.id} 
                                        className={`relative bg-white rounded-2xl shadow-sm border p-4 md:p-5 transition-all hover:shadow-md ${index === 0 ? 'border-blue-400 ring-1 ring-blue-400' : 'border-slate-200'}`}
                                    >
                                        {/* Badge para a melhor opção */}
                                        {index === 0 && (
                                            <div className={`absolute -top-3 right-6 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm flex items-center gap-1 ${sortBy === 'cost' ? 'bg-blue-600' : sortBy === 'contemplation' ? 'bg-amber-500' : 'bg-purple-600'}`}>
                                                <i data-lucide="star" className="w-3 h-3 fill-current"></i>
                                                {sortBy === 'cost' ? 'Menor Custo' : sortBy === 'contemplation' ? 'Mais Sorteios' : 'Mais Saudável'}
                                            </div>
                                        )}

                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                            
                                            {/* Bank Info */}
                                            <div className="flex items-center gap-3 md:w-3/12">
                                                <div className={`w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-xl shadow-inner ${inst.color} text-white shrink-0`}>
                                                    {inst.logo}
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-sm md:text-base text-slate-800 flex items-center gap-1.5 flex-wrap">
                                                        {inst.name}
                                                        {inst.isReliable && (
                                                            <span title="Alta Confiabilidade (Selo BCB)" className="inline-flex items-center text-emerald-600 bg-emerald-50 rounded-full p-0.5">
                                                                <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                                                            </span>
                                                        )}
                                                    </h3>
                                                    <div className="text-xs text-slate-500 mt-1 flex flex-col gap-0.5">
                                                        <span>Admin: <b>{inst.adminFee.toFixed(1).replace('.', ',')}%</b></span>
                                                        <span>Reserva: <b>{inst.reserveFund.toFixed(1).replace('.', ',')}%</b></span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Math/Fees Info */}
                                            <div className="md:w-3/12 flex flex-row md:flex-col justify-between items-start md:items-center py-3 border-y md:border-y-0 md:border-l border-slate-100 md:pl-4">
                                                <div className="text-left md:text-center">
                                                    <div className="text-[10px] md:text-xs text-slate-500 font-medium">Custo Total <InfoTooltip text="Valor do Crédito + Taxa de Admin + Fundo de Reserva. Seguro não incluso nesta simulação base."/></div>
                                                    <div className="font-bold text-sm md:text-base text-slate-700">{formatCurrency(inst.totalCost)}</div>
                                                </div>
                                                <div className="text-right md:text-center md:mt-2">
                                                    <div className="text-[10px] md:text-xs text-slate-500 font-medium">Custo Efetivo <InfoTooltip text="Percentual total cobrado a mais sobre o valor do crédito ao longo de todo o plano."/></div>
                                                    <div className="font-bold text-sm md:text-base text-red-500">+{inst.totalFeePercentage.toFixed(1).replace('.', ',')}%</div>
                                                </div>
                                            </div>

                                            {/* Health / Contemplation Stats - NEW */}
                                            <div className="md:w-3/12 py-1 md:py-3 border-b md:border-b-0 md:border-l border-slate-100 md:pl-4 flex flex-col justify-center">
                                                <div className="w-full">
                                                    <div className="flex justify-between items-center text-[10px] md:text-xs mb-1">
                                                        <span className="text-slate-500 font-medium flex items-center gap-1"><i data-lucide="zap" className="w-3 h-3 text-amber-500"></i> Contemplação</span>
                                                        <span className="font-bold text-amber-600">~{inst.contemplationRate.toFixed(1).replace('.', ',')}%/mês</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 rounded-full h-1.5 mb-2.5">
                                                        <div className="bg-amber-400 h-1.5 rounded-full" style={{ width: `${Math.min(inst.contemplationRate / 5 * 100, 100)}%` }}></div>
                                                    </div>
                                                    
                                                    <div className="flex justify-between items-center text-[10px] md:text-xs mb-1">
                                                        <span className="text-slate-500 font-medium flex items-center gap-1"><i data-lucide="heart-handshake" className="w-3 h-3 text-purple-500"></i> Inadimplência</span>
                                                        <span className="font-bold text-purple-600">{inst.defaultRate.toFixed(1).replace('.', ',')}%</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 rounded-full h-1.5">
                                                        <div className={`h-1.5 rounded-full ${inst.defaultRate < 4 ? 'bg-emerald-400' : inst.defaultRate < 7 ? 'bg-yellow-400' : 'bg-red-400'}`} style={{ width: `${Math.min(inst.defaultRate / 10 * 100, 100)}%` }}></div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Installment Info */}
                                            <div className="md:w-3/12 flex flex-col items-end justify-center md:border-l border-slate-100 md:pl-4">
                                                <div className="text-[10px] md:text-xs text-slate-500 font-medium mb-1">Parcela Mensal</div>
                                                <div className={`text-xl md:text-2xl font-black ${index === 0 ? 'text-blue-600' : 'text-slate-800'}`}>
                                                    {formatCurrency(inst.monthlyInstallment)}
                                                </div>
                                                <div className="text-[10px] md:text-xs text-slate-400 mt-1">
                                                    em {months}x
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="text-xs text-slate-400 text-center mt-8">
                                * Atenção: Este é um simulador educativo. As taxas apresentadas são <b>estimativas médias</b> baseadas no mercado. O <b>Banco Central do Brasil (BCB)</b> regulamenta e fiscaliza o setor, mas <b>não fixa</b> as taxas de administração — elas são definidas livremente pelas administradoras conforme o segmento. Consulte a instituição oficial antes de fechar negócio.
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        ReactDOM.render(<ConsorcioSimulator />, document.getElementById('root'));
    </script>
</body>
</html>
